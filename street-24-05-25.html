<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>24.05.25 — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            margin: 0 0 140px 0;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        figure:last-child {
            margin-bottom: 0;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }

        figcaption {
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
        }

        .image-description {
            max-width: 500px;
        }

        .end-marker {
            padding: 0 20px;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            figcaption {
                max-width: 100%;
            }

            .end-marker {
                padding: 0 14px;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }

        }

    </style>
</head>

<body>

<header>
    <div>24.05.25</div>
    <a href="art.html">← ART</a>
</header>

<main class="gallery" id="gallery"></main>

<div class="end-marker">
    [ end ]
</div>

<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>


<script>

    const gallery = document.getElementById("gallery");

    const folder = "images/24.05.25";
    const prefix = "24.05.25-";
    const imageCount = 22;


    /* --------------------------------
       IMAGE CAPTIONS

       Caption 0 = 24.05.25-000.jpg
       Caption 1 = 24.05.25-001.jpg
       Caption 2 = 24.05.25-002.jpg
       etc.
    -------------------------------- */

    const captions = [

        "Caption for image 000.",
        "Caption for image 001.",
        "Caption for image 002.",
        "Caption for image 003.",
        "Caption for image 004.",
        "Caption for image 005.",
        "Caption for image 006.",
        "Caption for image 007.",
        "Caption for image 008.",
        "Caption for image 009.",
        "Caption for image 010.",
        "Caption for image 011.",
        "Caption for image 012.",
        "Caption for image 013.",
        "Caption for image 014.",
        "Caption for image 015.",
        "Caption for image 016.",
        "Caption for image 017.",
        "Caption for image 018.",
        "Caption for image 019.",
        "Caption for image 020.",
        "Caption for image 021."

    ];


    /* --------------------------------
       GENERATE GALLERY
    -------------------------------- */

    for (let i = 0; i < imageCount; i++) {

        const number = String(i).padStart(3, "0");

        const figure = document.createElement("figure");

        const caption = captions[i] || "";

        figure.innerHTML = `
            <img
                src="${folder}/${prefix}${number}.jpg"
                alt=""
            >

            ${
                caption
                ? `
                    <figcaption>
                        <div class="image-description">
                            ${caption}
                        </div>
                    </figcaption>
                  `
                : ""
            }
        `;

        gallery.appendChild(figure);
    }

</script>
</body>
</html>
