<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>24.05.25 — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            margin: 0 0 140px 0;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        figure:last-child {
            margin-bottom: 0;
        }

        .image-entry {
            width: fit-content;
            max-width: 70vw;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }

        figcaption {
            margin-top: 12px;
            max-width: 700px;
        }

        .image-caption {
            max-width: 700px;
        }

        .end-marker {
            padding: 0 20px;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            .image-entry {
                max-width: 100%;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            figcaption {
                max-width: 100%;
            }

            .end-marker {
                padding: 0 14px;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }

        }

    </style>
</head>

<body>


<header>
    <div>24.05.25</div>
    <a href="art.html">← ART</a>
</header>


<main class="gallery" id="gallery"></main>


<div class="end-marker">
    [ end ]
</div>


<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>


<script>

    const gallery = document.getElementById("gallery");

    const folder = "images/24.05.25";
    const prefix = "24.05.25-";
    const imageCount = 22;

    const captions = [

        "Mi Luz - 000 | Tequila, Jalisco | Sony ZVE-10",
        "Viene de las Montañas - 001 | Tequila, Jalisco | Sony ZVE-10",
        "Aburrido - 002 | Tequila, Jalisco | Sony ZVE-10",
        "Ruco Perdido - 003 | Tequila, Jalisco | Sony ZVE-10",
        "Ruco Sincero - 004 | Tequila, Jalisco | Sony ZVE-10",
        "Untitled (ciego) - 005 | Tequila, Jalisco | Sony ZVE-10",
        "Ruco Rustico - 006 | Tequila, Jalisco | Sony ZVE-10",
        "Tetrápodo - 007 | Tequila, Jalisco | Sony ZVE-10",
        "Untitled (orejas) - 008 | Tequila, Jalisco | Sony ZVE-10",
        "Doble Hexá - 009 | Tequila, Jalisco | Sony ZVE-10",
        "Untitled (Palenquetas) - 010 | Tequila, Jalisco | Sony ZVE-10",
        "La Diversión los Espera - 011 | Tequila, Jalisco | Sony ZVE-10",
        "Infancia contra la Fiscalía General de la República - 012 | Tequila, Jalisco | Sony ZVE-10",
        "Callejón de Hambre - 013 | Tequila, Jalisco | Sony ZVE-10",
        "Anhelo - 014 | Tequila, Jalisco | Sony ZVE-10",
        "Carnicero y su Futuro - 015 | Tequila, Jalisco | Sony ZVE-10",
        "Los No Deseados - 016 | Tequila, Jalisco | Sony ZVE-10",
        "Nietos - 017 | Tequila, Jalisco | Sony ZVE-10",
        "Cachuchas de Basura - 018 | Tequila, Jalisco | Sony ZVE-10",
        "Bicicletas - 019 | Tequila, Jalisco | Sony ZVE-10",
        "Los Placéros - 020 | Tequila, Jalisco | Sony ZVE-10",
        "El Carrizal - 021 | Tequila, Jalisco | Sony ZVE-10"

    ];


    for (let i = 0; i < imageCount; i++) {

        const number = String(i).padStart(3, "0");
        const caption = captions[i] || "";

        const figure = document.createElement("figure");

        figure.innerHTML = `
            <div class="image-entry">

                <img
                    src="${folder}/${prefix}${number}.jpg"
                    alt=""
                >

                ${
                    caption
                    ? `
                        <figcaption>
                            <div class="image-caption">
                                ${caption}
                            </div>
                        </figcaption>
                      `
                    : ""
                }

            </div>
        `;

        gallery.appendChild(figure);
    }

</script>


</body>
</html>
