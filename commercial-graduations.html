<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
    <title>graduations — Victor M. Gonzalez</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            width: 100%;
            margin: 0 0 140px;
            display: flex;
            justify-content: center;
        }

        figure:last-child {
            margin-bottom: 0;
        }

        figure img {
            display: block;
            max-width: 70vw;
            max-height: 75vh;
            width: auto;
            height: auto;
        }

        .end-marker {
            padding: 0 20px;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {
            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }
            
figcaption {
    width: 100%;
    max-width: 700px;
    margin-top: 12px;
}

.image-description {
    max-width: 500px;
}

            
            .end-marker {
                padding: 0 14px;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }
        }
    </style>
</head>

<body>

<header>
    <div>graduations</div>
    <a href="commercial.html">← COMMERCIAL</a>
</header>

<main class="gallery" id="gallery"></main>

<div class="end-marker">
    [ end ]
</div>

<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>

<script>

    const gallery = document.getElementById("gallery");

    const folder = "images/commercial/graduations";
    const prefix = "graduations-";
    const imageCount = 9;

    const captions = [
        "encino.alyson.joshua.tree.000",
        "encino.alyson.joshua.tree.001",
        "encino.alyson.joshua.tree.002",
        "encino.alyson.joshua.tree.003",
        "hernandez.marisol.CC.000",
        "hernandez.marisol.CC.001",
        "hernandez.marisol.CC.002",
        "hernandez.marisol.CC.003",
        "hernandez.marisol.CC.004"
    ];

    for (let i = 0; i < imageCount; i++) {

        const number = String(i).padStart(3, "0");
        const caption = captions[i] || "";

        const figure = document.createElement("figure");

        figure.innerHTML = `
            <div>
                <img
                    src="${folder}/${prefix}${number}.jpg"
                    alt=""
                >

                ${
                    caption
                    ? `
                        <figcaption>
                            <div class="image-description">
                                ${caption}
                            </div>
                        </figcaption>
                      `
                    : ""
                }
            </div>
        `;

        gallery.appendChild(figure);
    }

</script>

</body>
</html>
