<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>23.09.24 — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            margin: 0 0 140px 0;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        figure:last-child {
            margin-bottom: 0;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }

        figcaption {
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
        }

        .image-description {
            max-width: 500px;
        }

        .end-marker {
            padding: 0 20px;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            figcaption {
                max-width: 100%;
            }

            .end-marker {
                padding: 0 14px;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }

        }

    </style>
</head>

<body>

<header>
    <div>23.09.24</div>
    <a href="art.html">← ART</a>
</header>

<main class="gallery" id="gallery"></main>

<div class="end-marker">
    [ end ]
</div>

<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>


<script>

    const gallery = document.getElementById("gallery");

    const folder = "images/14.06.25";
    const prefix = "14.06.25-";
    const imageCount = 14;


    /* --------------------------------
       IMAGE CAPTIONS

       Caption 0 = 24.05.25-000.jpg
       Caption 1 = 24.05.25-001.jpg
       Caption 2 = 24.05.25-002.jpg
       etc.
    -------------------------------- */

    const captions = [

        "Chinatown.LA.protest - 000",
        "Chinatown.LA.dust.on.lens - 001.",
        "Chinatown.LA.storefront - 002.",
        "Chinatown.LA.iphone.wallpaper - 003.",
        "Chinatown.LA.deux - 004.",
        "Chinatown.LA.untitled - 005.",
        "Chinatown.LA.untitled - 006.",
        "Chinatown.LA.untitled - 007.",
        "Chinatown.LA.bags - 008.",
        "Chinatown.LA.untitled - 009.",
        "Chinatown.LA.untitled - 010.",
        "Chinatown.LA.tuyet's - 011.",
        "Chinatown.LA.untitled - 012.",
        "Chinatown.LA.tights - 013.",

    ];


    /* --------------------------------
       GENERATE GALLERY
    -------------------------------- */

    for (let i = 0; i < imageCount; i++) {

        const number = String(i).padStart(3, "0");

        const figure = document.createElement("figure");

        const caption = captions[i] || "";

        figure.innerHTML = `
            <img
                src="${folder}/${prefix}${number}.jpg"
                alt=""
            >

            ${
                caption
                ? `
                    <figcaption>
                        <div class="image-description">
                            ${caption}
                        </div>
                    </figcaption>
                  `
                : ""
            }
        `;

        gallery.appendChild(figure);
    }

</script>

</body>
</html>
