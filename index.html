<!DOCTYPE html>

    <title>Victor M. Gonzalez — Artist / Photographer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        .page {
            min-height: 100vh;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 70px;
        }

        .name,
        .description {
            margin: 0;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .projects {
            margin-bottom: 55px;
        }

        .projects a,
        .information a {
            display: block;
        }

        /* CONTACT */

        .contact {
            position: relative;
            cursor: default;
        }

        .contact-details {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            margin-left: 14px;
            white-space: nowrap;
        }

        .contact:hover .contact-details {
            display: block;
        }

        footer {
            margin-top: auto;
            padding-top: 70px;
        }

        @media (max-width: 600px) {

            .page {
                padding: 14px;
            }

            header {
                margin-bottom: 55px;
            }

            .projects {
                margin-bottom: 45px;
            }

            .contact-details {
                position: static;
                margin-left: 0;
                margin-top: 4px;
            }
        }

    </style>
</head>
