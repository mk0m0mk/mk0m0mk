<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
    <title>general — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            margin: 0;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        .image-entry {
            width: fit-content;
            max-width: 70vw;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }

        figcaption {
            margin-top: 12px;
            max-width: 700px;
        }

        .image-title {
            margin-bottom: 2px;
        }

        .image-link {
            display: block;
            overflow-wrap: anywhere;
        }

        .end-marker {
            padding: 120px 20px 0;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            .image-entry {
                max-width: 100%;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            .end-marker {
                padding: 100px 14px 0;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }

        }

    </style>
</head>

<body>


<header>
    <div>general</div>
    <a href="commercial.html">← COMMERCIAL</a>
</header>


<main class="gallery">

    <figure>

        <div class="image-entry">

            <img
                src="images/commercial/general/general-000.jpg"
                alt=""
            >

            <figcaption>

                <div class="image-title">
                    calarts.accepted.students.day.11.04.26
                </div>

                <a
                    class="image-link"
                    href="https://www.photos.calarts.edu/Institute/Accepted-Student-Event-4-11-2026"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    https://www.photos.calarts.edu/Institute/Accepted-Student-Event-4-11-2026
                </a>

            </figcaption>

        </div>

    </figure>

</main>


<div class="end-marker">
    [ end ]
</div>


<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>


</body>
</html>
