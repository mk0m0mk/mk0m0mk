<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">

    <title>general — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

        figure {
            margin: 0 0 140px 0;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        figure:last-child {
            margin-bottom: 0;
        }

        .image-entry {
            width: fit-content;
            max-width: 70vw;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }

        figcaption {
            margin-top: 12px;
            max-width: 700px;
        }

        .image-title {
            margin-bottom: 2px;
        }

        .image-link {
            display: block;
            overflow-wrap: anywhere;
        }

        .placeholder-text {
            display: block;
        }

        .end-marker {
            padding: 0 20px;
        }

        .site-footer {
            padding: 0 20px 18px;
            margin-top: 100px;
        }

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            .image-entry {
                max-width: 100%;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            .end-marker {
                padding: 0 14px;
            }

            .site-footer {
                padding: 0 14px 14px;
                margin-top: 80px;
            }

        }

    </style>
</head>

<body>


<header>
    <div>general</div>
    <a href="commercial.html">← COMMERCIAL</a>
</header>


<main class="gallery" id="gallery"></main>


<div class="end-marker">
    [ end ]
</div>


<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>


<script>

    const gallery = document.getElementById("gallery");


    const entries = [

        {
            image: "general-000.jpg",
            title: "open.show.24.04.26",
            link: "https://www.photos.calarts.edu/School-of-Film-Video/Open-Show-4-24-2026",
            linkText: "https://www.photos.calarts.edu/School-of-Film-Video/Open-Show-4-24-2026"
        },

        {
            image: "general-001.jpg",
            title: "calarts.accepted.students.day.11.04.26",
            link: "https://www.photos.calarts.edu/Institute/Accepted-Student-Event-4-11-2026",
            linkText: "https://www.photos.calarts.edu/Institute/Accepted-Student-Event-4-11-2026."
        },

        {
            image: "general-002.jpg",
            title: "jorge.gutierrez.27.02.26",
            link: "https://www.photos.calarts.edu/School-of-Film-Video/Jorge-Gutierrez-2-27-2026",
            linkText: "https://www.photos.calarts.edu/School-of-Film-Video/Jorge-Gutierrez-2-27-2026"
        }

    ];


    for (const entry of entries) {

        const figure = document.createElement("figure");


        const secondLine = entry.link
            ? `
                <a
                    class="image-link"
                    href="${entry.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${entry.linkText}
                </a>
              `
            : `
                <div class="placeholder-text">
                    ${entry.linkText}
                </div>
              `;


        figure.innerHTML = `
            <div class="image-entry">

                <img
                    src="images/commercial/general/${entry.image}"
                    alt=""
                >

                <figcaption>

                    <div class="image-title">
                        ${entry.title}
                    </div>

                    ${secondLine}

                </figcaption>

            </div>
        `;


        gallery.appendChild(figure);
    }

</script>


</body>
</html>
