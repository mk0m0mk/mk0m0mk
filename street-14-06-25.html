        html,

        /* HEADER */

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }


        /* GALLERY */

        .gallery {
            width: 100%;
            padding: 100px 20px 120px;
        }

            margin: 0 0 140px 0;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }


        /* IMAGE TEXT */

        figcaption {
            width: 100%;
            max-width: 700px;
            margin-top: 12px;
        }

        .image-description {
            max-width: 500px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
            }

            figure {
                margin-bottom: 100px;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            figcaption {
                max-width: 100%;
            }

        }

    </style>
