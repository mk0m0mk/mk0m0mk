<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exhibition — Victor M. Gonzalez</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        .page {
            min-height: 100vh;
            padding: 18px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 70px;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .exhibition-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .exhibition-entry {
            display: grid;
            grid-template-columns: 260px auto;
            width: fit-content;
        }

        .exhibition-location {
            padding-right: 40px;
        }

        @media (max-width: 600px) {
            .page {
                padding: 14px;
            }

            header {
                margin-bottom: 55px;
            }

            .exhibition-list {
                gap: 18px;
            }

            .exhibition-entry {
                display: block;
            }

            .exhibition-location {
                padding-right: 0;
            }

            .exhibition-title {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div>EXHIBITION</div>
        <a href="index.html">← INDEX</a>
    </header>

    <main class="exhibition-list">

        <a
            class="exhibition-entry"
            href="exhibition-30-04-26.html"
        >
            <span class="exhibition-location">
                D301.calarts.losangeles.30.04.26
            </span>

            <span class="exhibition-title">
                OVERTIME.bfa1.photography.foundation.show
            </span>
        </a>


        <a
            class="exhibition-entry"
            href="exhibition-08-12-25.html"
        >
            <span class="exhibition-location">
                D301.calarts.losangeles.08.12.25
            </span>

            <span class="exhibition-title">
                Pre-Wash.bfa1.photography.foundation.show
            </span>
        </a>

    </main>

</div>

</body>

</html>
