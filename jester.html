<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jester (fluid) — Victor M. Gonzalez</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 400;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }


        /* HEADER */

        header {
            position: fixed;
            top: 18px;
            left: 20px;
            right: 20px;

            display: flex;
            justify-content: space-between;

            z-index: 100;
            pointer-events: none;
        }

        header a,
        header div {
            pointer-events: auto;
        }


        /* GALLERY */

        .gallery {
            width: 100%;
            min-height: 100vh;

            padding: 100px 20px 120px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        figure {
            margin: 0;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        figure img {
            display: block;

            max-width: 70vw;
            max-height: 75vh;

            width: auto;
            height: auto;
        }


        /* IMAGE TEXT */

        figcaption {
            width: 100%;
            max-width: 700px;

            margin-top: 12px;
        }

        .image-description {
            max-width: 500px;
        }


.end-marker {
    padding: 0 20px;
    margin-top: 40px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.35;

    color: #000000;
}

@media (max-width: 600px) {
    .end-marker {
        padding: 0 14px;
    }
}
        

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                top: 14px;
                left: 14px;
                right: 14px;
            }

            .gallery {
                padding: 90px 14px 100px;
                min-height: 100vh;
            }

            figure img {
                max-width: 100%;
                max-height: none;
            }

            figcaption {
                max-width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div>
        jester
    </div>

    <a href="art.html">
        ← ART
    </a>

</header>


<main class="gallery">

    <figure>

        <img
            src="images/canvas/jester/jester-000.jpg"
            alt="jester"
        >

        <figcaption>

            <div class="image-description">
                Jester (fluid) - 8x10”
                An exploration in nontraditional canvas paint, ink, and dyes through action painting techniques and psychic automatism.

Enamel and acrylic paints, block printing ink, and powdered color fiber dye on cotton duck canvas.

Photographed with Canon 5DMK4 70-200
            </div>

        </figcaption>

    </figure>

</main>

<div class="end-marker">
    [ end ]
</div>

<footer class="site-footer">
    [ © Victor M. Gonzalez, 2026 ]
</footer>

    
</body>

</html>
